name: Restore old releases to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Twine
        run: python -m pip install --upgrade twine

      - name: Check distribution
        run: |
          python -m twine check dist/pyside6_webusb-0.0.0-py3-none-any.whl

      - name: Upload test distribution
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --verbose \
            dist/pyside6_webusb-0.0.0-py3-none-any.whl
