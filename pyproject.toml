[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyside6-webusb"
version = "0.0.5.post3"
description = "A WebUSB API implementation for PySide6/QtWebEngine apps (QWebChannel bridge + pyusb backend + JS polyfill)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "pyside6-webusb contributors" },
]
keywords = ["pyside6", "qt", "qtwebengine", "webusb", "usb", "pyusb", "qwebchannel", "polyfill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Hardware",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "PySide6-Essentials>=6.5",
    "PySide6-Addons>=6.5",
    "pyusb>=1.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
# 🆕 v0.0.5a0: `python -m pyside6_webusb` と同じ環境診断レポートを、
# pip install後に直接コマンドとして呼べるようにする(python -m ...の存在を
# 知らないユーザーでも `pyside6-webusb-doctor` で気づける入口を用意する)。
pyside6-webusb-doctor = "pyside6_webusb.__main__:main"

[project.urls]
Homepage = "https://github.com/steck0714/Pyside6-webusb"
Issues = "https://github.com/steck0714/Pyside6-webusb/issues"
"Mock-APIs (parent project)" = "https://github.com/steck0714/Mock-webusb"
Specification = "https://wicg.github.io/webusb/"

[tool.setuptools.packages.find]
where = ["src"]
